<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12121A">
<title>🍜 맛집 지도</title>
<link rel="icon" type="image/png" href="icons/favicon.png">
<style>
  :root { --bg:#12121A; --surface:#1E1E2A; --surface2:#2C2C3E; --accent:#FFB300; --text:#F2F2F7; --sub:#9A9AB0; --win:#FF3D5A; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Noto Sans Thai", sans-serif; }
  #app { display:flex; flex-direction:column; height:100%; }
  header { padding:calc(8px + env(safe-area-inset-top)) 12px 8px; display:flex; align-items:center; gap:8px; }
  header h1 { font-size:18px; margin:0; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .back { color:var(--text); text-decoration:none; font-size:22px; padding:2px 6px; }
  .chips { display:flex; gap:6px; overflow-x:auto; padding:0 12px 8px; scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .chip { flex:none; border:0; background:var(--surface); color:var(--text); padding:7px 12px; border-radius:20px; font-size:14px; cursor:pointer; }
  .chip.on { background:var(--accent); color:#000; font-weight:700; }
  #map { flex:1; min-height:0; background:var(--surface); }
  button { font-family:inherit; }
  .primary { background:var(--accent); color:#000; border:0; border-radius:12px; padding:11px 14px; font-size:15px; font-weight:700; cursor:pointer; }
  .ghost { background:var(--surface2); color:var(--text); border:0; border-radius:12px; padding:11px 12px; font-size:15px; cursor:pointer; }
  .icon { background:var(--surface); color:var(--text); border:0; border-radius:20px; padding:7px 11px; font-size:15px; cursor:pointer; }
  .sheet { position:fixed; left:0; right:0; bottom:0; background:var(--bg); border-top-left-radius:18px; border-top-right-radius:18px;
    box-shadow:0 -6px 24px rgba(0,0,0,.5); padding:18px 16px calc(18px + env(safe-area-inset-bottom));
    max-height:82%; overflow-y:auto; transform:translateY(110%); transition:transform .25s; z-index:10; }
  .sheet.open { transform:translateY(0); }
  .sheet h2 { margin:0 0 4px; font-size:19px; padding-right:30px; }
  .sub { color:var(--sub); font-size:13px; line-height:1.4; }
  .row { display:flex; gap:8px; margin:10px 0; }
  .row > * { flex:1; }
  label { display:block; font-size:13px; color:var(--sub); margin:12px 0 5px; }
  input, select, textarea { width:100%; padding:11px; border:0; border-radius:12px; background:var(--surface); color:var(--text); font-size:16px; font-family:inherit; }
  input.bad { outline:2px solid var(--win); }
  .stars { color:var(--accent); letter-spacing:1px; }
  .rv { border-top:1px solid var(--surface2); padding:9px 0; font-size:15px; line-height:1.4; }
  .x { position:absolute; right:10px; top:8px; background:none; border:0; font-size:26px; color:var(--sub); cursor:pointer; }
  gmp-place-autocomplete { width:100%; color-scheme:dark; }
  .toast { position:fixed; left:50%; top:calc(64px + env(safe-area-inset-top)); transform:translateX(-50%); background:var(--surface2); color:var(--text);
    padding:9px 15px; border-radius:10px; font-size:14px; opacity:0; transition:opacity .2s; z-index:20; pointer-events:none; }
  .toast.show { opacity:1; }
  .setup { margin:auto; max-width:340px; padding:24px; text-align:center; line-height:1.6; color:var(--sub); }
  .legend { position:fixed; left:10px; bottom:calc(14px + env(safe-area-inset-bottom)); background:rgba(18,18,26,.94); border-radius:14px; padding:10px 12px;
    box-shadow:0 4px 16px rgba(0,0,0,.5); z-index:5; max-width:calc(100% - 20px); display:none; }
  .legend.show { display:block; }
  .legend b { display:block; font-size:14px; margin-bottom:6px; }
  .lg { display:flex; align-items:center; gap:8px; font-size:13px; padding:4px 0; cursor:pointer; }
  .lg i { flex:none; width:22px; height:5px; border-radius:3px; }
  .icon.on { background:var(--accent); color:#000; }
  .pin { background:#1E1E2A; border:2px solid var(--accent); border-radius:20px; padding:3px 8px; font-size:13px; font-weight:700; color:#F2F2F7;
    box-shadow:0 2px 6px rgba(0,0,0,.4); white-space:nowrap; max-width:160px; overflow:hidden; text-overflow:ellipsis; }
</style>
</head>
<body>
<div id="app">
  <header>
    <a class="back" id="back" href="./">←</a>
    <h1 id="title"></h1>
    <button class="icon" id="btnRoutes">🚐</button>
    <button class="icon" id="btnLocate">📍</button>
    <button class="primary" id="btnAdd" style="padding:8px 12px;font-size:14px"></button>
  </header>
  <div class="chips" id="chips"></div>
  <div id="map"></div>
</div>

<div class="sheet" id="detailSheet"><button class="x" data-close>×</button><div id="detailBody"></div></div>

<div class="sheet" id="addSheet">
  <button class="x" data-close>×</button>
  <h2 id="tAdd"></h2>
  <label id="lSearch"></label>
  <div id="acWrap"></div>
  <div id="picked" class="sub" style="margin-top:6px"></div>
  <div id="tapHint" class="sub" style="margin-top:4px">💡 </div>
  <div id="catBox"><label id="lCat"></label><select id="fCat"></select></div>
  <label id="lNick"></label>
  <input id="fNick" maxlength="20" autocomplete="nickname">
  <label id="lMenu"></label>
  <div class="row" style="margin:0"><input id="fMenu1" maxlength="30"><input id="fMenu2" maxlength="30"></div>
  <label id="lComment"></label>
  <textarea id="fComment" rows="2" maxlength="200"></textarea>
  <div class="row"><button class="primary" id="btnSave"></button></div>
</div>

<div class="legend" id="legend"></div>

<div class="toast" id="toast"></div>

async function start() {
  const [{ initializeApp }, fs] = await Promise.all([
    import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js'),

    const known = places.find((x) => x.placeId === picked.placeId);
    $('catBox').style.display = known ? 'none' : '';
    $('picked').textContent = `✅ ${picked.name} · ${picked.address}`;
  };
  ac.addEventListener('gmp-select', (e) => pick(e.placePrediction.toPlace()));
  ac.addEventListener('gmp-placeselect', (e) => pick(e.place)); // 이전 버전 호환

  // 🗺️ 지도에서 바로 고르기: 가게 아이콘을 누르면 그 가게, 빈 곳을 누르면 근처 가게 목록
  const { Place } = await google.maps.importLibrary('places');
  const FOOD = ['restaurant', 'cafe', 'bar', 'bakery', 'meal_takeaway', 'coffee_shop', 'pub', 'food_court', 'night_club'];
  const startAdd = (pl) => {
    const known = places.find((x) => x.placeId === pl.placeId);
    picked = known || pl; $('picked').textContent = `✅ ${picked.name} · ${picked.address}`;
    $('catBox').style.display = known ? 'none' : ''; openSheet('addSheet');
    if (known) toast(t.already);
  };
  const fromPlace = async (place) => {
    await place.fetchFields({ fields: ['id', 'displayName', 'formattedAddress', 'location', 'googleMapsURI'] });
    return { placeId: place.id, name: place.displayName || '', address: place.formattedAddress || '', lat: place.location.lat(), lng: place.location.lng(), mapsUrl: place.googleMapsURI || '' };
  };
  const choose = (list) => {
    $('detailBody').innerHTML = `<h2>📍 ${esc(t.near)}</h2>` + (list.length
      ? list.map((p, i) => `<div class="rv" data-i="${i}" style="cursor:pointer"><b>${esc(p.name)}</b><div class="sub">${esc(p.address)}</div></div>`).join('')
      : `<div class="sub" style="margin-top:10px">${esc(t.nearNone)}</div>`);
    $('detailBody').querySelectorAll('[data-i]').forEach((el) => { el.onclick = () => startAdd(list[+el.dataset.i]); });
    openSheet('detailSheet');
  };
  map.addListener('click', async (e) => {
    try {
      if (e.placeId) { // 구글맵의 가게 아이콘
        e.stop();
        const known = places.find((x) => x.placeId === e.placeId);
        if (known) return detail(known);
        return startAdd(await fromPlace(new Place({ id: e.placeId })));
      }
      if (document.querySelector('.sheet.open')) return closeSheets();
      const { places: near } = await Place.searchNearby({
        fields: ['id', 'displayName', 'formattedAddress', 'location', 'googleMapsURI'],
        locationRestriction: { center: e.latLng, radius: 120 }, includedTypes: FOOD, maxResultCount: 8, rankPreference: 'DISTANCE',
      });
      choose((near || []).map((pl) => ({ placeId: pl.id, name: pl.displayName || '', address: pl.formattedAddress || '', lat: pl.location.lat(), lng: pl.location.lng(), mapsUrl: pl.googleMapsURI || '' })));
    } catch (err) { console.error(err); toast(t.fail); }
  });

  $('fNick').value = store('wg-map-nick') || '';
  ['fNick', 'fMenu1'].forEach((id) => $(id).addEventListener('input', () => $(id).classList.remove('bad')));
  $('btnAdd').onclick = () => { picked = null; $('picked').textContent = ''; $('catBox').style.display = ''; openSheet('addSheet'); };
  // 🚐 썽태우 노선
  let routesOn = false;
  const layer = routeLayer(map, google, L, (r) => routeInfo(r));
  function routeInfo(r) {
    layer.focus(r.id);
    $('detailBody').innerHTML = `<h2><span style="display:inline-block;width:26px;height:6px;border-radius:3px;background:${r.color};vertical-align:middle;margin-right:8px"></span>${esc(r.name[L] || r.name.en)}</h2>
      <div style="font-size:15px;line-height:1.5;margin-top:6px">${esc(r.desc[L] || r.desc.en)}</div>
      <div class="sub" style="margin-top:10px">💵 ${esc(rt.fare)}</div><div class="sub" style="margin-top:6px">⚠️ ${esc(rt.warn)}</div>`;
    openSheet('detailSheet');
  }
  $('legend').innerHTML = `<b>${esc(rt.title)}</b>` + ROUTES.map((r) => `<div class="lg" data-r="${r.id}"><i style="background:${r.color}"></i>${esc(r.name[L] || r.name.en)}</div>`).join('') + `<div class="sub" style="margin-top:6px">${esc(rt.approx)}</div>`;
  $('legend').querySelectorAll('.lg').forEach((el) => { el.onclick = () => routeInfo(ROUTES.find((r) => r.id === el.dataset.r)); });
  $('btnRoutes').onclick = async () => {
    routesOn = !routesOn; $('btnRoutes').classList.toggle('on', routesOn); $('legend').classList.toggle('show', routesOn);
    closeSheets(); await layer.show(routesOn);
    if (routesOn) toast(rt.warn);
  };
  if (qs.get('routes') === '1') $('btnRoutes').onclick();

  $('btnLocate').onclick = () => {
    if (!navigator.geolocation) return toast(t.locNo);
    navigator.geolocation.getCurrentPosition((p) => { map.setCenter({ lat: p.coords.latitude, lng: p.coords.longitude }); map.setZoom(15); }, () => toast(t.locNo));
  };

  // 여러 사람이 적은 메뉴 중 많이 나온 순으로 3개
  const topMenus = (id) => Object.entries(stats[id]?.menus || {}).sort((a, b) => b[1] - a[1]).slice(0, 3).map((x) => x[0]).join(' · ');
  function draw() {
    markers.splice(0).forEach((m) => { m.map = null; });
    places.filter((p) => active === 'all' || p.category === active).forEach((p) => {
      const pin = document.createElement('div'); pin.className = 'pin';
      pin.textContent = `${catEmoji(p.category)} ${p.name}`;
      const m = new AdvancedMarkerElement({ map, position: { lat: p.lat, lng: p.lng }, content: pin, title: p.name });
      m.addListener('click', () => detail(p));
      markers.push(m);
    });
  }

  function detail(p) {
    const n = stats[p.placeId]?.n || 0;
    $('detailBody').innerHTML = `
      <h2>${catEmoji(p.category)} ${esc(p.name)}</h2>
      <div class="sub">${esc(p.address)}</div>
      <div class="sub" style="margin-top:6px">${n} ${esc(t.reviews)} · ${esc(t.by)}: ${esc(p.addedBy)}</div>
      ${topMenus(p.placeId) ? `<div style="margin-top:8px;font-size:15px">🍽️ ${esc(topMenus(p.placeId))}</div>` : ''}
      <div class="row"><button class="primary" id="bOpen">📍 ${esc(t.open)}</button></div>
      <div class="row"><button class="ghost" id="bWolf">🐺 ${esc(t.wolf)}</button></div>
      <div class="row"><button class="ghost" id="bMore">${esc(t.more)}</button><button class="ghost" id="bShare" style="flex:.6">${esc(t.share)}</button></div>
      <div id="rvs"></div>`;
    $('bOpen').onclick = () => { location.href = viewUrl(p); };
    $('bWolf').onclick = () => { location.href = WOLF_SEARCH + encodeURIComponent(p.name); };
    $('bMore').onclick = () => { picked = p; $('picked').textContent = `✅ ${p.name} · ${p.address}`; $('catBox').style.display = 'none'; openSheet('addSheet'); };
    $('bShare').onclick = async () => {
      const url = `${location.origin}${location.pathname}#${p.id}`;
      if (navigator.share) navigator.share({ title: p.name, url }).catch(() => {});
      else { try { await navigator.clipboard.writeText(url); toast(t.copied); } catch (_) { prompt('', url); } }
    };
    map.panTo({ lat: p.lat, lng: p.lng });
    openSheet('detailSheet');
    if (unsubRv) unsubRv();
    unsubRv = onSnapshot(query(collection(db, 'reviews'), where('placeId', '==', p.placeId)), (snap) => {
      const list = snap.docs.map((d) => d.data()).sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
      $('rvs').innerHTML = list.map((r) => `<div class="rv">${(r.menus || []).length ? `<div>🍽️ ${esc(r.menus.join(' · '))}</div>` : ''}${r.comment ? `<div>${esc(r.comment)}</div>` : ''}<div class="sub">${esc(r.nickname)}</div></div>`).join('');
    });
  }

  $('btnSave').onclick = async () => {
    const nickname = $('fNick').value.trim();
    if (!picked) return toast(t.needPlace);
    if (!nickname) { $('fNick').classList.add('bad'); $('fNick').focus(); return toast(t.needNick); }
    const menus = [$('fMenu1').value.trim(), $('fMenu2').value.trim()].filter(Boolean).slice(0, 2), comment = $('fComment').value.trim();
    if (!menus.length) { $('fMenu1').classList.add('bad'); $('fMenu1').focus(); return toast(t.needMenu); }
    $('btnSave').disabled = true;
    try {
      store('wg-map-nick', nickname);
      if (!places.find((x) => x.placeId === picked.placeId)) {
        await addDoc(collection(db, 'places'), {
          placeId: picked.placeId, name: picked.name.slice(0, 120), address: picked.address.slice(0, 300),
          lat: picked.lat, lng: picked.lng, mapsUrl: picked.mapsUrl.slice(0, 500), category: $('fCat').value,
          addedBy: nickname, createdAt: serverTimestamp(),
        });
      }
      await addDoc(collection(db, 'reviews'), { placeId: picked.placeId, menus, comment, nickname, createdAt: serverTimestamp() });
      toast(t.saved); $('fComment').value = ''; $('fMenu1').value = ''; $('fMenu2').value = ''; picked = null; $('picked').textContent = ''; closeSheets();
    } catch (e) { console.error(e); toast(`${t.fail}: ${e.code || e.message}`); }
    finally { $('btnSave').disabled = false; }
  };

  onSnapshot(collection(db, 'places'), (snap) => {
    places = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    draw();
    const want = location.hash.slice(1), hit = want && places.find((x) => x.id === want);
    if (!fitted && hit) { map.setCenter({ lat: hit.lat, lng: hit.lng }); map.setZoom(16); detail(hit); fitted = true; }
    else if (!fitted && places.length) {
      const b = new google.maps.LatLngBounds(); places.forEach((p) => b.extend({ lat: p.lat, lng: p.lng }));
      map.fitBounds(b, 60); if (places.length === 1) map.setZoom(15); fitted = true;
    }
  });
  onSnapshot(collection(db, 'reviews'), (snap) => {
    stats = {};
    snap.docs.forEach((d) => { const r = d.data(); const s = (stats[r.placeId] ||= { n: 0, menus: {} }); s.n += 1; (r.menus || []).forEach((m) => { s.menus[m] = (s.menus[m] || 0) + 1; }); });
  });
}
</script>
</body>
</html>
